<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway Overdrive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #1a1d21; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: #fff; }
        #game-container { position: relative; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); border: 4px solid #444; border-radius: 12px; background-color: #34495e; }
        canvas { display: block; border-radius: 8px; }
        
        /* UI Layer for the Live Score */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; }
        #score-board { 
            font-size: 1.6rem; font-weight: bold; color: #f1c40f; 
            text-shadow: 2px 2px 4px #000; background: rgba(0,0,0,0.5); 
            padding: 8px 15px; border-radius: 6px; display: inline-block;
            border: 1px solid #f1c40f;
        }
        
        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 20, 25, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; border-radius: 8px; }
        #game-over-screen h1 { color: #e74c3c; margin-bottom: 10px; font-size: 2.8rem; text-transform: uppercase;}
        button { margin-top: 25px; padding: 12px 30px; font-size: 1.2rem; font-weight: bold; background: #f1c40f; color: #1a1d21; border: none; cursor: pointer; border-radius: 6px; transition: all 0.2s;}
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="650"></canvas>
    <div class="ui-layer">
        <div id="score-board">SCORE: <span id="score">0</span></div>
    </div>
    <div id="game-over-screen">
        <h1>CRASHED!</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="resetGame()">PLAY AGAIN</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Load Local Images
    const playerImg = new Image(); playerImg.src = 'player.png';
    const enemyImg = new Image(); enemyImg.src = 'enemy.png';
    const barrierImg = new Image(); barrierImg.src = 'barrier.png';

    // Game State
    let score = 0;
    let isGameOver = false;
    let animationId;
    let gameSpeed = 6;
    let frameCount = 0;

    const carWidth = 45;
    const carHeight = 85;
    const player = { x: 177, y: 530, width: carWidth, height: carHeight };
    let obstacles = [];
    let roadLines = [0, 150, 300, 450, 600];
    let keys = {};

    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    class Obstacle {
        constructor() {
            // 20% chance to spawn a barrier instead of a car
            this.isBarrier = Math.random() > 0.8;
            
            // Barriers are wider and shorter than cars
            this.width = this.isBarrier ? 70 : carWidth;
            this.height = this.isBarrier ? 30 : carHeight;
            
            const lanes = [55, 177, 295]; 
            this.x = lanes[Math.floor(Math.random() * lanes.length)];
            
            // Adjust barrier X position so it centers in the lane
            if (this.isBarrier) this.x -= 12; 
            
            this.y = -this.height;
            
            // Barriers don't drive, so their speed is 0 (they move exactly at road speed)
            this.speed = this.isBarrier ? 0 : Math.random() * 2 + 1; 
        }
        update() {
            this.y += gameSpeed - this.speed;
        }
        draw() {
            if (this.isBarrier) {
                // Check if image loaded successfully, otherwise draw a fallback shape
                if (barrierImg.complete && barrierImg.naturalHeight !== 0) {
                    ctx.drawImage(barrierImg, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = '#e67e22'; // Orange fallback barrier
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            } else {
                if (enemyImg.complete && enemyImg.naturalHeight !== 0) {
                    ctx.drawImage(enemyImg, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = '#e74c3c'; // Red fallback enemy car
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            }
        }
    }

    function spawnObstacle() {
        const spawnInterval = Math.max(30, 90 - Math.floor(score / 1000) * 10);
        if (frameCount % spawnInterval === 0) {
            obstacles.push(new Obstacle());
        }
    }

    function detectCollision(rect1, rect2) {
        const buffer = 5; // Forgiving collision box
        return rect1.x + buffer < rect2.x + rect2.width - buffer &&
               rect1.x + rect1.width - buffer > rect2.x + buffer &&
               rect1.y + buffer < rect2.y + rect2.height - buffer &&
               rect1.y + rect1.height - buffer > rect2.y + buffer;
    }

    function update() {
        if (isGameOver) return;
        frameCount++;
        score += 2; 
        
        if (score % 800 === 0 && gameSpeed < 15) gameSpeed += 0.5;

        // LIVE SCORE UPDATE
        document.getElementById('score').innerText = Math.floor(score / 10);

        // Player Movement
        if (keys['ArrowLeft'] && player.x > 30) player.x -= 7;
        if (keys['ArrowRight'] && player.x < canvas.width - player.width - 30) player.x += 7;

        // Road Lines
        for (let i = 0; i < roadLines.length; i++) {
            roadLines[i] += gameSpeed;
            if (roadLines[i] > canvas.height) roadLines[i] = -80;
        }

        spawnObstacle();

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.update();
            
            if (obs.y > canvas.height) {
                obstacles.splice(i, 1);
            }

            if (detectCollision(player, obs)) gameOver();
        }
    }

    function draw() {
        // Draw Grass & Road
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#34495e';
        ctx.fillRect(30, 0, canvas.width - 60, canvas.height);

        // Draw Road Lines
        ctx.fillStyle = '#ecf0f1';
        for (let i = 0; i < roadLines.length; i++) {
            ctx.fillRect(130, roadLines[i], 8, 60);
            ctx.fillRect(260, roadLines[i], 8, 60);
        }
        
        // Draw Player
        if (playerImg.complete && playerImg.naturalHeight !== 0) {
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
        } else {
            ctx.fillStyle = '#3498db'; // Blue fallback player car
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        // Draw Obstacles
        obstacles.forEach(obs => obs.draw());
    }

    function gameLoop() {
        update();
        draw();
        if (!isGameOver) animationId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isGameOver = true;
        cancelAnimationFrame(animationId);
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('final-score').innerText = Math.floor(score / 10);
    }

    function resetGame() {
        score = 0;
        gameSpeed = 6;
        frameCount = 0;
        isGameOver = false;
        obstacles = [];
        player.x = 177;
        document.getElementById('score').innerText = 0;
        document.getElementById('game-over-screen').style.display = 'none';
        gameLoop();
    }

    // Start immediately
    gameLoop();
</script>
</body>
</html>
